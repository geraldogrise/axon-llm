<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pyaxon — AxonLM demo</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #2b3442; --text: #e6edf3;
    --muted: #9aa7b4; --accent: #6ea8fe; --accent2: #7ee0c0;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --panel:#fff; --border:#d5dbe2; --text:#1a2029;
            --muted:#5b6672; --accent:#2563eb; --accent2:#0f9d76; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; padding:40px 20px 80px; }
  h1 { font-size:2rem; letter-spacing:-1px; margin:0 0 4px; }
  h1 .ax { color:var(--accent2); } h1 .dot { color:var(--accent); }
  .sub { color:var(--muted); margin:0 0 28px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:22px; box-shadow:0 6px 22px rgba(0,0,0,.15); }
  label { display:block; font-weight:600; font-size:.85rem; color:var(--muted);
    margin:14px 0 6px; text-transform:uppercase; letter-spacing:.4px; }
  input[type=text], textarea { width:100%; background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:9px; padding:11px 13px; font-size:1rem;
    font-family:inherit; }
  textarea { resize:vertical; min-height:120px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:120px; }
  input[type=range] { width:100%; }
  .val { color:var(--accent); font-weight:700; }
  button { margin-top:20px; width:100%; background:var(--accent); color:#fff; border:none;
    border-radius:9px; padding:13px; font-size:1rem; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .out { margin-top:22px; white-space:pre-wrap; background:var(--bg);
    border:1px dashed var(--border); border-radius:9px; padding:16px; min-height:60px;
    font-family:"SF Mono","JetBrains Mono",Consolas,monospace; font-size:.95rem; }
  .out .prompt { color:var(--accent2); font-weight:700; }
  footer { color:var(--muted); font-size:.85rem; margin-top:26px; text-align:center; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="ax">py</span>axon<span class="dot">.</span> — AxonLM</h1>
  <p class="sub">Mini language model (decoder-only Transformer) trained from scratch,
    served by a REST API. C++ core, Python API.</p>

  <div class="card">
    <label for="prompt">Prompt</label>
    <input type="text" id="prompt" value="a barata" placeholder="type a beginning...">

    <div class="row">
      <div>
        <label>Tokens: <span class="val" id="ntv">40</span></label>
        <input type="range" id="ntokens" min="5" max="120" value="40">
      </div>
      <div>
        <label>Temperature: <span class="val" id="tv">0.7</span></label>
        <input type="range" id="temp" min="1" max="15" value="7">
      </div>
      <div>
        <label>Top-k: <span class="val" id="kv">5</span></label>
        <input type="range" id="topk" min="1" max="20" value="5">
      </div>
    </div>

    <button id="go">Generate text</button>
    <div class="out" id="out">The generation appears here.</div>
  </div>

  <footer>pyaxon · AxonLM servido via <code>examples/serve.py</code></footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  $("ntokens").oninput = () => $("ntv").textContent = $("ntokens").value;
  $("temp").oninput = () => $("tv").textContent = ($("temp").value / 10).toFixed(1);
  $("topk").oninput = () => $("kv").textContent = $("topk").value;

  $("go").onclick = async () => {
    const btn = $("go"), out = $("out");
    const prompt = $("prompt").value || " ";
    btn.disabled = true; btn.textContent = "Generating...";
    out.textContent = "";
    try {
      const resp = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt,
          n_tokens: parseInt($("ntokens").value),
          temperature: parseFloat($("temp").value) / 10,
          top_k: parseInt($("topk").value),
        }),
      });
      const data = await resp.json();
      if (data.error) { out.textContent = "Error: " + data.error; }
      else {
        const rest = data.text.startsWith(prompt) ? data.text.slice(prompt.length) : data.text;
        out.innerHTML = '<span class="prompt"></span>';
        out.querySelector(".prompt").textContent = prompt;
        out.append(document.createTextNode(rest));
      }
    } catch (e) {
      out.textContent = "Request failed: " + e;
    } finally {
      btn.disabled = false; btn.textContent = "Generate text";
    }
  };
</script>
</body>
</html>
